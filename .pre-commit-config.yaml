repos:
  # ============================================================
  # GLOBAL: file hygiene and secret scanning (any language)
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (local)
        entry: gitleaks protect --staged --redact --verbose
        language: system
        pass_filenames: false
        always_run: true

  # ============================================================
  # NODE.JS / NEXT.JS (uses node_modules)
  # Delete this block if the repo has no JS/TS.
  # ============================================================
  - repo: local
    hooks:
      - id: eslint
        name: eslint (local)
        entry: npx --no-install eslint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]

      - id: prettier
        name: prettier (local)
        entry: npx --no-install prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, markdown]

      - id: tsc
        name: typecheck (local)
        entry: npx --no-install tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

  # ============================================================
  # PYTHON (uses .venv)
  # Delete this block if the repo has no Python.
  # If the venv lives in a subfolder, change .venv/bin/ to
  # <subfolder>/.venv/bin/ in every entry below.
  # ============================================================
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (local)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format (local)
        entry: .venv/bin/ruff format
        language: system
        types: [python]

      - id: bandit
        name: bandit (local)
        entry: .venv/bin/bandit -ll
        language: system
        types: [python]

      - id: pip-audit
        name: pip-audit (local)
        entry: .venv/bin/pip-audit
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

  # ============================================================
  # SECURITY SCANNING: Python + JS/TS (uses .venv)
  # Semgrep is a Python tool, so it lives in the venv here.
  # ============================================================
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (local)
        entry: .venv/bin/semgrep scan --config p/default --error --quiet
        language: system
        types_or: [python, javascript, jsx, ts, tsx]

  # ============================================================
  # R (uses renv library)
  # Delete this block if the repo has no R code.
  # ============================================================
  - repo: local
    hooks:
      - id: lintr
        name: lintr (local)
        entry: Rscript -e 'for (f in commandArgs(trailingOnly = TRUE)) { l <- lintr::lint(f); print(l); if (length(l)) quit(status = 1) }'
        language: system
        types: [r]
